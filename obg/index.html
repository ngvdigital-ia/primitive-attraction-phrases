<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You — Primitive Attraction Phrases</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .checkmark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1a7a35;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }

    .checkmark svg {
      width: 36px;
      height: 36px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 16px;
      color: #0a0a0a;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #1a7a35;
      border-radius: 2px;
      margin: 0 auto 32px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #555;
      line-height: 1.65;
      margin-bottom: 40px;
    }

    .email-label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #999;
      margin-bottom: 22px;
    }

    .email-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .email-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #444;
      font-size: 0.8rem;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .email-btn:hover {
      transform: translateY(-4px);
      opacity: 0.85;
    }

    .email-btn .icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="checkmark">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <h1>Congratulations on Your Purchase of<br>Primitive Attraction Phrases!</h1>

    <div class="divider"></div>

    <p class="subtitle">
      To access your program, simply verify your email.<br>
      Your login details and download link are waiting for you.
    </p>

    <p class="email-label">Check your inbox</p>

    <div class="email-icons">

      <!-- Gmail -->
      <a class="email-btn" href="https://mail.google.com" target="_blank" rel="noopener">
        <span class="icon-wrap" style="background:#fff; border:1px solid #e0e0e0;">
          <svg width="36" height="36" viewBox="0 0 48 48">
            <path fill="#4285F4" d="M45 40H3c-1.66 0-3-1.34-3-3V11c0-1.66 1.34-3 3-3h42c1.66 0 3 1.34 3 3v26c0 1.66-1.34 3-3 3z"/>
            <path fill="#fff" d="M3 11l21 13.5L45 11"/>
            <path fill="#EA4335" d="M3 8h42L24 24.5z"/>
            <path fill="#34A853" d="M45 8v32l-21-16z"/>
            <path fill="#FBBC05" d="M3 8v32l21-16z"/>
            <path fill="#EA4335" d="M3 40l21-16 21 16"/>
          </svg>
        </span>
        Gmail
      </a>

      <!-- Outlook -->
      <a class="email-btn" href="https://outlook.live.com" target="_blank" rel="noopener">
        <span class="icon-wrap" style="background:#0078d4;">
          <svg width="36" height="36" viewBox="0 0 48 48">
            <!-- envelope body -->
            <rect x="4" y="12" width="40" height="28" rx="3" fill="#fff" opacity="0.15"/>
            <!-- O letter -->
            <text x="6" y="34" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="24" fill="#fff">O</text>
            <!-- right panel lines -->
            <rect x="26" y="14" width="16" height="2" rx="1" fill="#fff" opacity="0.7"/>
            <rect x="26" y="19" width="16" height="2" rx="1" fill="#fff" opacity="0.5"/>
            <rect x="26" y="24" width="12" height="2" rx="1" fill="#fff" opacity="0.4"/>
          </svg>
        </span>
        Outlook
      </a>

      <!-- Yahoo -->
      <a class="email-btn" href="https://mail.yahoo.com" target="_blank" rel="noopener">
        <span class="icon-wrap" style="background:#6001d2;">
          <svg width="36" height="36" viewBox="0 0 48 48">
            <text x="4" y="34" font-family="Helvetica,Arial,sans-serif" font-weight="900" font-size="28" fill="#fff">Y!</text>
          </svg>
        </span>
        Yahoo Mail
      </a>

    </div>

  </div>

</body>
</html>
